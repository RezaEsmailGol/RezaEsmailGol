<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Mohammad Reza Esmail Gol — Software Engineer</title>
<desc id="desc">GitHub profile banner for Mohammad Reza Esmail Gol focused on Odoo, Python backend, full-stack engineering and AI/LLM systems.</desc>
<defs>
